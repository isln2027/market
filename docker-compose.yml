services:
  market:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: market
    build:
      dockerfile: market-app/Dockerfile
    image: market-app
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      KC_HOST: ${KC_HOST}
      KC_PORT: ${KC_PORT}
      KC_SECRET: ${KC_SECRET}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PAYMENT_SCHEMA: ${PAYMENT_SCHEMA}
      PAYMENT_HOST: ${PAYMENT_HOST}
      PAYMENT_PORT: ${PAYMENT_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      SPRING_PROFILES_ACTIVE: production

  payment:
    container_name: payment-service
    build:
      dockerfile: payment-service/Dockerfile
    image: payment-service
    restart: on-failure
    ports:
      - "${PAYMENT_PORT}:8081"
    environment:
      KC_HOST: ${KC_HOST}
      KC_PORT: ${KC_PORT}
      PAYMENT_PORT: ${PAYMENT_PORT}
      SPRING_PROFILES_ACTIVE: production

  db:
    container_name: postgres
    image: postgres:17.5
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"

  cache:
    container_name: redis
    image: redis:8.10
    restart: always
    ports:
      - "${REDIS_PORT}:6379"

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev --import-realm
    environment:
      MARKET_HOST: localhost
      MARKET_PORT: 8080
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    volumes:
      - ./kc_import:/opt/keycloak/data/import
volumes:
  db-data: