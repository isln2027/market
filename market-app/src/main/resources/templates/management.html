<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание Item</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4" style="max-width: 720px;">

    <h1 class="h3 mb-4">Новый Item</h1>

    <!-- Сообщения об ошибках (если контроллер кладёт в модель) -->
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <span th:text="${error}">Ошибка сохранения</span>
    </div>

    <!--
        ВАЖНО:
        - th:action="@{/items/management}" — добавляет CSRF и контекстный путь
        - enctype="multipart/form-data" — обязательно для загрузки файла
        - method="post"
    -->
    <form th:action="@{/items/management}"
          th:object="${item}"
          method="post"
          enctype="multipart/form-data"
          class="card p-4">

        <!-- title -->
        <div class="mb-3">
            <label for="title" class="form-label">Название</label>
            <input type="text"
                   id="title"
                   class="form-control"
                   th:field="*{title}"
                   required
                   maxlength="255">
            <div class="text-danger small" th:if="${#fields.hasErrors('title')}"
                 th:errors="*{title}"></div>
        </div>

        <!-- description -->
        <div class="mb-3">
            <label for="description" class="form-label">Описание</label>
            <textarea id="description"
                      class="form-control"
                      rows="4"
                      th:field="*{description}"></textarea>
            <div class="text-danger small" th:if="${#fields.hasErrors('description')}"
                 th:errors="*{description}"></div>
        </div>

        <!-- price -->
        <div class="mb-3">
            <label for="price" class="form-label">Цена</label>
            <input type="number"
                   id="price"
                   class="form-control"
                   th:field="*{price}"
                   min="0"
                   step="1"
                   required>
            <div class="text-danger small" th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}"></div>
        </div>

        <!-- file -->
        <div class="mb-3">
            <label for="file" class="form-label">Изображение</label>
            <input type="file"
                   id="file"
                   name="file"
                   class="form-control"
                   accept="image/*"
                   required>
            <div class="form-text">Поддерживаются форматы изображений (png, jpg, webp).</div>
        </div>

        <!-- Кнопки -->
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/}" class="btn btn-secondary">На главную</a>
        </div>
    </form>

</div>
</body>
</html>
