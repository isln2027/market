<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body style="margin:0; height:100vh; display:flex; align-items:center; justify-content:center; background:#fff; color:#000; font-family:sans-serif;">

<div style="padding:24px 32px; border:2px solid #2e7d32; border-radius:12px; text-align:center; min-width:280px;">

    <div style="margin-bottom:16px; font-size:18px;">Вход</div>

    <div th:if="${error}"
         style="margin-bottom:12px; color:#c62828; font-size:14px;">
        Неверное имя пользователя или пароль
    </div>

    <div th:if="${logout}"
         style="margin-bottom:12px; color:#2e7d32; font-size:14px;">
        Вы вышли из системы
    </div>

    <form th:action="@{/login}" method="post" style="display:flex; flex-direction:column; gap:12px;">

        <input type="text" name="username" placeholder="Имя пользователя" required autofocus
               style="padding:10px 12px; border:2px solid #2e7d32; border-radius:8px; font-family:inherit; font-size:14px; color:#000; background:#fff; outline:none;"/>

        <input type="password" name="password" placeholder="Пароль" required
               style="padding:10px 12px; border:2px solid #2e7d32; border-radius:8px; font-family:inherit; font-size:14px; color:#000; background:#fff; outline:none;"/>

        <button type="submit"
                style="padding:10px 12px; border:2px solid #2e7d32; border-radius:8px; background:#2e7d32; color:#fff; font-family:inherit; font-size:14px; cursor:pointer;">
            Войти
        </button>

    </form>

</div>

</body>
</html>
