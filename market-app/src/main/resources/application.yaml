application:
  upload:
    path: market-app/uploads
  view:
    item:
      max-items-in-row: 3

logging:
  level:
    io.r2dbc.postgresql.QUERY: DEBUG

spring:
  security:
    oauth2:
      client:
        registration:
          keycloak:
            provider: keycloak
            client-id: frontend-service
            client-secret: C60oWwz1kYBhtY0LOhC1SFt8gzeAnMQH
            authorization-grant-type: client_credentials
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/market
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:market}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    pool:
      enabled: true
      initial-size: 10
      max-size: 50
      max-idle-time: 30s
      max-life-time: 10m
      validation-query: SELECT 1
  sql:
    init:
      mode: always
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    redis:
      time-to-live: 60
  logging:
    level:
      DEBUG

payment:
  api:
    path: ${PAYMENT_SCHEMA:http}://${PAYMENT_HOST:localhost}:${PAYMENT_PORT:8081}