<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Администрирование</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <h1 class="mb-4">Пользователи</h1>

    <!-- Форма добавления пользователя: POST /admin/user -->
    <form th:action="@{/admin/user}" method="post" class="card p-3 mb-4">
        <h5 class="mb-3">Добавить пользователя</h5>
        <div class="d-flex gap-2">
            <input type="text"
                   name="username"
                   class="form-control"
                   placeholder="Имя пользователя"
                   required>
            <button type="submit" class="btn btn-primary">Добавить</button>
        </div>
    </form>

    <!-- Таблица пользователей -->
    <div class="card">
        <table class="table table-striped mb-0">
            <thead>
            <tr>
                <th>Пользователь</th>
                <th class="text-end">Действия</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user}"></td>
                <td class="text-end">
                    <a th:href="@{/admin/balance(username=${user})}"
                       class="btn btn-sm btn-outline-primary">
                        Управление балансом →
                    </a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(users)}">
                <td colspan="2" class="text-center text-muted py-3">
                    Пользователей пока нет
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
