<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Баланс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Баланс пользователя</h1>
        <a th:href="@{/admin}" class="btn btn-outline-secondary">← К списку</a>
    </div>

    <!-- Текущий баланс -->
    <div class="card p-3 mb-3">
        <div class="mb-1">
            <span class="text-muted">Пользователь:</span>
            <span th:text="${username}" class="fw-bold"></span>
        </div>
        <div>
            <span class="text-muted">Текущий баланс:</span>
            <span th:text="${balance}" class="fw-bold fs-5"></span>
        </div>
    </div>

    <!-- Форма изменения баланса: POST /admin/balance -->
    <form th:action="@{/admin/balance}" method="post" class="card p-3">
        <input type="hidden" name="username" th:value="${username}">

        <div class="mb-3">
            <label for="balance" class="form-label">Новый баланс</label>
            <input type="number"
                   id="balance"
                   name="balance"
                   class="form-control"
                   th:value="${balance}"
                   step="1"
                   min="0"
                   required>
            <div class="form-text">Значение должно быть неотрицательным целым.</div>
        </div>

        <div class="d-flex gap-2">
            <!-- Сохранить: отправляет POST на /admin/balance -->
            <button type="submit" class="btn btn-primary">Сохранить</button>

            <!-- Обновить: GET-запрос на ту же страницу (перечитает баланс) -->
            <a th:href="@{/admin/balance(username=${username})}"
               class="btn btn-outline-secondary">
                Обновить
            </a>
        </div>
    </form>
</div>
</body>
</html>
