<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление балансом</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4" style="max-width: 640px;">
    <h1 class="h3 mb-4">Управление балансом</h1>
    <div class="card mb-4">
        <div class="card-body">
            <div class="text-muted small">Текущий баланс</div>
            <div class="fs-2 fw-semibold"
                 th:text="|${balance} руб.|">0 руб.
            </div>
        </div>
    </div>

    <form th:action="@{/admin/balance}" method="post" class="card p-3">
        <div class="mb-3">
            <label for="balance" class="form-label">Новый баланс</label>
            <input type="number"
                   id="balance"
                   name="balance"
                   class="form-control"
                   th:value="${balance}"

                   step="1"
                   required>
            <div class="form-text">Значение должно быть неотрицательным целым.</div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a th:href="@{/admin/balance}" class="btn btn-secondary">Обновить</a>
        </div>
    </form>

</div>
</body>
</html>
